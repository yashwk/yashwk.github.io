<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Facet Gradients for the Y monogram -->
    <linearGradient id="fav-l-arm" x1="14" y1="14" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="fav-r-arm" x1="50" y1="14" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
    <linearGradient id="fav-stem-l" x1="28" y1="34" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="fav-stem-r" x1="36" y1="34" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Container plate with subtle rounded border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#fav-bg)" stroke="#30363d" stroke-width="2.5"/>

  <!-- Subtle ambient corner glow -->
  <circle cx="32" cy="32" r="20" fill="#38bdf8" opacity="0.08"/>

  <!-- Left Upper Wing / Arm -->
  <polygon points="14,14 26,14 32,32 25,32" fill="url(#fav-l-arm)" stroke="#38bdf8" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Right Upper Wing / Arm -->
  <polygon points="50,14 38,14 32,32 39,32" fill="url(#fav-r-arm)" stroke="#00f5ff" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Left Lower Stem Keel -->
  <polygon points="25,32 32,32 32,52 26,52" fill="url(#fav-stem-l)" stroke="#38bdf8" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Right Lower Stem Keel -->
  <polygon points="39,32 32,32 32,52 38,52" fill="url(#fav-stem-r)" stroke="#7dd3fc" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Centerline Ridge Glint -->
  <line x1="32" y1="28" x2="32" y2="52" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Apex Diamond Core (Central Fusion Nexus) -->
  <polygon points="32,26 36,32 32,38 28,32" fill="#ffffff" stroke="#00f5ff" stroke-width="1"/>
</svg>
