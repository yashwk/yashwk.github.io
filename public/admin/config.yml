backend:
  name: github
  repo: yashwk/yashwk.github.io
  branch: main

media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    format: "frontmatter"
    editor:
      preview: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "src/content/projects"
    create: true
    delete: true
    slug: "{{slug}}"
    format: "frontmatter"
    editor:
      preview: true
    fields:
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "Project Name", name: "name", widget: "string" }
      - { label: "Tagline", name: "tagline", widget: "string" }
      - { label: "Card Short Description", name: "description", widget: "text", required: false }
      - { label: "Icon Path", name: "icon", widget: "string", default: "/favicon.svg" }
      - { label: "Repository URL", name: "repo", widget: "string" }
      - { label: "Related Blog Post Slug", name: "blogSlug", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Overview Body", name: "body", widget: "markdown" }
