<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Neon Glow Filter matching AI luminescence -->
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Global Chromatic Diagonal Gradient (Cyan top-left to Violet bottom-right) -->
    <linearGradient id="xt-chroma" x1="12" y1="6" x2="88" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Central Voxel Cube Facet Gradients -->
    <linearGradient id="xt-core-top" x1="38" y1="38" x2="62" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="xt-core-left" x1="38" y1="44" x2="50" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="xt-core-right" x1="62" y1="44" x2="50" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <g filter="url(#neon)">
    <!-- ============================================== -->
    <!-- 1. ISOMETRIC BOUNDING CUBE & PERSPECTIVE GRIDS -->
    <!-- ============================================== -->

    <!-- Top Ceiling Isometric Diamond Grid -->
    <g stroke="#00f0ff" stroke-width="1.2" opacity="0.45">
      <!-- Grid lines parallel to Top-Left -> Center -->
      <line x1="31" y1="15.5" x2="69" y2="34.5"/>
      <line x1="21.5" y1="20.2" x2="59.5" y2="39.2"/>
      <line x1="40.5" y1="10.8" x2="78.5" y2="29.8"/>

      <!-- Grid lines parallel to Top-Right -> Center -->
      <line x1="69" y1="15.5" x2="31" y2="34.5"/>
      <line x1="78.5" y1="20.2" x2="40.5" y2="39.2"/>
      <line x1="59.5" y1="10.8" x2="21.5" y2="29.8"/>
    </g>

    <!-- Back Vertical Wall Coordinate Grids -->
    <g stroke="#38bdf8" stroke-width="1" opacity="0.35">
      <!-- Left back wall vertical lines -->
      <line x1="21" y1="20" x2="21" y2="55"/>
      <line x1="31" y1="15" x2="31" y2="45"/>
      <line x1="41" y1="11" x2="41" y2="40"/>
      <!-- Left back wall isometric horizontals -->
      <line x1="12" y1="35" x2="38" y2="48"/>
      <line x1="12" y1="45" x2="38" y2="58"/>

      <!-- Right back wall vertical lines -->
      <line x1="79" y1="20" x2="79" y2="55"/>
      <line x1="69" y1="15" x2="69" y2="45"/>
      <line x1="59" y1="11" x2="59" y2="40"/>
      <!-- Right back wall isometric horizontals -->
      <line x1="88" y1="35" x2="62" y2="48"/>
      <line x1="88" y1="45" x2="62" y2="58"/>
    </g>

    <!-- ============================================== -->
    <!-- 2. REAR SUMMIT MOUNTAIN WIREFRAME (NORTH)      -->
    <!-- ============================================== -->
    <!-- Dark Mountain Occlusion Underlay -->
    <polygon points="18,34 32,23 41,18 50,10 59,18 68,23 82,34 62,48 50,44 38,48" fill="#0d1424"/>

    <!-- High Elevation Contour Slices (Joy Division 3D DEM Wireframe) -->
    <!-- Slice 1: Summit Horn -->
    <polyline points="43,15 47,12 50,10 53,12 57,15" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slice 2: Upper Crest Spire -->
    <polyline points="37,20 42,16 46,18 50,12 54,18 58,16 63,20" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slice 3: Secondary Peaks & Ridges -->
    <polyline points="31,25 36,21 41,23 45,21 50,15 55,21 59,23 64,21 69,25" stroke="#00f0ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slice 4: Upper Slopes -->
    <polyline points="25,30 30,26 35,28 40,25 46,26 50,20 54,26 60,25 65,28 70,26 75,30" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slice 5: Mid Slopes entering Canyon -->
    <polyline points="20,35 25,31 31,33 37,29 43,32 50,27 57,32 63,29 69,33 75,31 80,35" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slice 6: Base Ridge behind Core -->
    <polyline points="16,39 22,36 28,38 35,34 42,37 50,33 58,37 65,34 72,38 78,36 84,39" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Transverse Mountain Ridge Lines (Connecting Peaks across Slices) -->
    <polyline points="50,10 50,12 50,15 50,20 50,27 50,33 50,38" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <polyline points="47,12 45,21 43,32 42,37" stroke="#00f0ff" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
    <polyline points="53,12 55,21 57,32 58,37" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
    <polyline points="42,16 40,25 37,29 35,34" stroke="#00f0ff" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
    <polyline points="58,16 60,25 63,29 65,34" stroke="#818cf8" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>

    <!-- ============================================== -->
    <!-- 3. LATERAL MOUNTAIN FLANKS (WEST & EAST)       -->
    <!-- ============================================== -->
    <!-- Left Ridge (Western Mountain Flank - Cyan) -->
    <g stroke="#00f0ff" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="14,44 19,38 24,42 28,37 32,41 38,44" stroke-width="1.8"/>
      <polyline points="14,49 19,43 24,47 28,42 33,46 38,49" stroke-width="1.7"/>
      <polyline points="14,54 20,49 25,52 30,48 35,51 38,54" stroke-width="1.6"/>
      <polyline points="28,37 28,42 30,48" stroke-width="1.4" opacity="0.75"/>
    </g>

    <!-- Right Ridge (Eastern Mountain Flank - Violet) -->
    <g stroke="#c084fc" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="62,44 68,41 72,37 76,42 81,38 86,44" stroke-width="1.8"/>
      <polyline points="62,49 67,46 72,42 76,47 81,43 86,49" stroke-width="1.7"/>
      <polyline points="62,54 65,51 70,48 75,52 80,49 86,54" stroke-width="1.6"/>
      <polyline points="72,37 72,42 70,48" stroke-width="1.4" opacity="0.75"/>
    </g>

    <!-- ============================================== -->
    <!-- 4. CENTRAL COMPRESSION VOXEL CORE CUBE         -->
    <!-- ============================================== -->
    <!-- Top Face (Lit Diamond) -->
    <polygon points="50,38 62,44 50,50 38,44" fill="url(#xt-core-top)" stroke="#00f0ff" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Left Face (Navy/Cyan) -->
    <polygon points="38,44 50,50 50,66 38,60" fill="url(#xt-core-left)" stroke="#00f0ff" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Right Face (Dark Navy/Violet) -->
    <polygon points="62,44 50,50 50,66 62,60" fill="url(#xt-core-right)" stroke="#818cf8" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Core Center Crease Spine -->
    <line x1="50" y1="50" x2="50" y2="66" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>

    <!-- ============================================== -->
    <!-- 5. FOREGROUND MOUNTAIN KNOLL (SOUTHERN SPIRE)  -->
    <!-- ============================================== -->
    <!-- Underlay -->
    <polygon points="26,67 36,60 44,57 50,64 56,57 64,60 74,67 50,78" fill="#101226"/>

    <!-- Foreground Terrain Wireframe Slices (Framing the bottom of the cube) -->
    <!-- Slice A: Forefront Twin Horns -->
    <polyline points="32,64 38,58 44,55 50,61 56,55 62,58 68,64" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slice B: Mid Forefront Slope -->
    <polyline points="28,68 35,63 42,61 50,66 58,61 65,63 72,68" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slice C: Lower Forefront Skirt -->
    <polyline points="24,72 32,68 40,66 50,71 60,66 68,68 76,72" stroke="#c084fc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slice D: Base Ground Contour -->
    <polyline points="20,76 29,73 38,71 50,76 62,71 71,73 80,76" stroke="#a855f7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Transverse Ridge connecting Foreground Peaks -->
    <polyline points="44,55 42,61 40,66 38,71" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="56,55 58,61 60,66 62,71" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round"/>

    <!-- ============================================== -->
    <!-- 6. BOTTOM ISOMETRIC WIREFRAME COLUMN MATRIX    -->
    <!-- ============================================== -->
    <!-- Vertical Matrix Column Lines (Dropping from terrain to cube floor) -->
    <g stroke="#a855f7" stroke-width="1.3" opacity="0.75" stroke-linecap="round">
      <line x1="20" y1="76" x2="20" y2="74"/>
      <line x1="26" y1="74" x2="26" y2="77"/>
      <line x1="32" y1="72" x2="32" y2="80"/>
      <line x1="38" y1="71" x2="38" y2="83"/>
      <line x1="44" y1="73" x2="44" y2="87"/>
      <line x1="50" y1="76" x2="50" y2="94"/>
      <line x1="56" y1="73" x2="56" y2="87"/>
      <line x1="62" y1="71" x2="62" y2="83"/>
      <line x1="68" y1="72" x2="68" y2="80"/>
      <line x1="74" y1="74" x2="74" y2="77"/>
      <line x1="80" y1="76" x2="80" y2="74"/>
    </g>

    <!-- ============================================== -->
    <!-- 7. OUTER ISOMETRIC BOUNDING MATRIX CUBE FRAME  -->
    <!-- ============================================== -->
    <polygon points="50,6 88,25 88,70 50,94 12,70 12,25" stroke="url(#xt-chroma)" stroke-width="2.6" stroke-linejoin="round"/>

    <!-- Front Bottom Center Axis -->
    <line x1="50" y1="66" x2="50" y2="94" stroke="#c084fc" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
