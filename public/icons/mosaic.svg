<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Neon Glow Filter matching project suite -->
    <filter id="neon-mosaic" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Emerald / Mint / Cyan Gradients for MoE Expert Tiles -->
    <linearGradient id="ms-tile-active" x1="35" y1="20" x2="65" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="ms-tile-cyan" x1="20" y1="40" x2="50" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="ms-tile-dark1" x1="30" y1="30" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="ms-tile-dark2" x1="40" y1="40" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132a24"/>
      <stop offset="100%" stop-color="#061a14"/>
    </linearGradient>

    <linearGradient id="ms-stream-line" x1="15" y1="85" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Ambient Routing Grid Lines -->
  <g opacity="0.35">
    <circle cx="50" cy="50" r="38" stroke="#34d399" stroke-width="0.75" stroke-dasharray="3 3"/>
    <circle cx="50" cy="50" r="26" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 4"/>
  </g>

  <!-- Base Inactive / Memory Tier Tiles (Dark Slate Matrix) -->
  <!-- Top-left tile -->
  <polygon points="50,16 66,25 50,34 34,25" fill="url(#ms-tile-dark1)" stroke="#334155" stroke-width="0.8"/>
  <!-- Left tile -->
  <polygon points="34,25 50,34 34,43 18,34" fill="url(#ms-tile-dark2)" stroke="#1e293b" stroke-width="0.8"/>
  <!-- Right tile -->
  <polygon points="66,25 82,34 66,43 50,34" fill="url(#ms-tile-dark2)" stroke="#1e293b" stroke-width="0.8"/>
  <!-- Bottom-left tile -->
  <polygon points="34,43 50,52 34,61 18,52" fill="url(#ms-tile-dark1)" stroke="#334155" stroke-width="0.8"/>
  <!-- Bottom-right tile -->
  <polygon points="66,43 82,52 66,61 50,52" fill="url(#ms-tile-dark1)" stroke="#334155" stroke-width="0.8"/>
  <!-- Bottom center tile -->
  <polygon points="50,52 66,61 50,70 34,61" fill="url(#ms-tile-dark2)" stroke="#1e293b" stroke-width="0.8"/>
  <!-- Lower apex tier -->
  <polygon points="50,70 66,79 50,88 34,79" fill="url(#ms-tile-dark1)" stroke="#1e293b" stroke-width="0.8"/>

  <!-- Active Routed Expert Tiles (Glowing Mint / Cyan MoE Cluster) -->
  <g filter="url(#neon-mosaic)">
    <!-- Central Active Expert Core -->
    <polygon points="50,34 66,43 50,52 34,43" fill="url(#ms-tile-active)" stroke="#6ee7b7" stroke-width="1.2"/>

    <!-- Top Activated Expert -->
    <polygon points="50,16 66,25 50,34 34,25" fill="#10b981" fill-opacity="0.35" stroke="#34d399" stroke-width="1"/>

    <!-- Bottom Activated Expert -->
    <polygon points="50,52 66,61 50,70 34,61" fill="url(#ms-tile-cyan)" fill-opacity="0.85" stroke="#7dd3fc" stroke-width="1"/>

    <!-- Hot Expert Core Diamond Highlight -->
    <polygon points="50,40 56,43 50,46 44,43" fill="#ffffff" opacity="0.95"/>
    <circle cx="50" cy="43" r="2" fill="#ffffff"/>

    <!-- Data Streaming / Routing Bus Rays (mmap disk -> CPU SIMD -> GPU LRU) -->
    <path d="M 18,34 L 34,43 L 50,43" stroke="#34d399" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 82,34 L 66,43 L 50,43" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 50,88 L 50,70 L 50,52" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Peripheral Expert Pulse Nodes -->
    <circle cx="18" cy="34" r="2.2" fill="#34d399"/>
    <circle cx="82" cy="34" r="2.2" fill="#38bdf8"/>
    <circle cx="50" cy="16" r="2" fill="#6ee7b7"/>
    <circle cx="50" cy="88" r="2.2" fill="#38bdf8"/>
    <circle cx="66" cy="61" r="1.8" fill="#34d399"/>
    <circle cx="34" cy="61" r="1.8" fill="#38bdf8"/>
  </g>
</svg>
